{% extends 'base.html' %}

{% block content %}
<div class="container pt-4">
<h1>Pessoas</h1>
<p><a href="{% url 'pessoa:adicionar_pessoa' %}">Adicionar pessoa</a></p>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for pessoa in pessoas %}
        <tr>
            <td>{{ pessoa.id }}</td>
            <td>{{ pessoa.nome }}</td>
            <td>{{ pessoa.cpf }}</td>
            <td>{{ pessoa.telefone }}</td>
            <td>
                <a href="{% url 'pessoa:detalhar_pessoa' pessoa.id %}">Detalhar</a>
                <a href="{% url 'pessoa:editar_pessoa' pessoa.id %}">Editar</a>
                <a href="{% url 'pessoa:excluir_pessoa' pessoa.id %}">Excluir</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">Nenhuma pessoa cadastrada.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
