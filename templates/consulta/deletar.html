{% extends 'base.html' %}

{% block content %}
<div class="container pt-4">
    <h1>Excluir consulta</h1>
    <p>Tem certeza de que deseja excluir a consulta de {{ consulta.pessoa.nome }} com o médico {{ consulta.medico.nome }} em {{ consulta.dataHora|date:'d/m/Y H:i' }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
    </form>
    <p><a href="/consulta/">Voltar para a lista</a></p>
</div>
{% endblock %}
