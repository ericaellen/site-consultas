{% extends 'base.html' %}

{% block content %}
<div class="container pt-4">
    <h1>{{ titulo|default:'Editar consulta' }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>
    <p><a href="{% url 'consulta:lista_consultas' %}">Voltar para a lista</a></p>
</div>
{% endblock %}
