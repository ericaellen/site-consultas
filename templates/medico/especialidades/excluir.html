{% extends 'base.html' %}

{% block content %}
<div class="container pt-4">
    <h1>Excluir especialidade</h1>
    <p>Tem certeza de que deseja excluir a especialidade "{{ especialidade.nome }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
    </form>
    <p><a href="{% url 'lista_especialidades' %}">Cancelar</a></p>
</div>
{% endblock %}
